version: 0.2

phases:
  build:
    commands:
      - echo "Preparing static website deployment ZIP..."
      - test -f index.html
      - test -f appspec.yml
      - test -f scripts/before_install.sh
      - test -f scripts/after_install.sh
      - test -f scripts/start.sh
      - mkdir -p output/scripts
      - cp index.html appspec.yml output/
      - cp scripts/*.sh output/scripts/
      - cd output
      - zip -r ../website-deployment.zip .
      - cd ..

artifacts:
  files:
    - website-deployment.zip
